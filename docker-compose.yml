services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PYAPP_HOST: 0.0.0.0
      PYAPP_PORT: 3000
      PYAPP_POSTGRES_DB_HOST: db
      PYAPP_POSTGRES_DB_PASSWORD: golang-first-api
      PYAPP_MONGODB_URI: mongodb://root:golang-first-api@mongodb:27017/?authSource=admin
      PYAPP_SECRET_KEY: ${PYAPP_SECRET_KEY:-change-me-to-a-long-random-string}
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_started

  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: golang-first-api
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  mongodb:
    image: mongo:6.0.8
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: golang-first-api
